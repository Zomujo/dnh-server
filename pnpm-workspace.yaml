allowBuilds:
  '@firebase/util': true
  '@nestjs/core': true
  '@scarf/scarf': true
  '@suites/di.nestjs': true
  '@suites/doubles.vitest': true
  '@swc/core': true
  bcrypt: true
  msgpackr-extract: true
  protobufjs: false
  unrs-resolver: false

overrides:
  # Security floors for transitive dependencies (pnpm audit).
  # africastalking pins exact, vulnerable versions of these.
  'africastalking>axios': ^1.20.0
  'africastalking>body-parser': ^2.4.0
  'africastalking>joi': ^18.3.1
  # Dependabot advisories in transitive dependencies (patched floors).
  'fast-xml-parser@5': ^5.12.0
  'follow-redirects@1': ^1.16.2
  'glob@>=9.0.0 <14.0.2': ^14.0.2
  'minimatch@>=7.0.0 <11.0.1': ^11.0.1
  'joi@18': ^18.3.1
  'multer@2': ^2.5.0
  'undici@7': ^7.30.1
