allowBuilds:
  '@firebase/util': true
  '@nestjs/core': true
  '@scarf/scarf': true
  '@suites/di.nestjs': true
  '@suites/doubles.vitest': true
  '@swc/core': true
  bcrypt: true
  msgpackr-extract: true
  protobufjs: false
  unrs-resolver: false

overrides:
  # Security floors for transitive dependencies (pnpm audit).
  # africastalking pins exact, vulnerable versions of these.
  'africastalking>axios': ^1.20.0
  'africastalking>body-parser': ^2.4.0
  'africastalking>joi': ^18.2.9
